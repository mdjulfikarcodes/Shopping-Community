<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping-Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        @theme {
            --font-poppins: "Poppins", sans-serif;
            --font-opensans: "Open Sans", sans-serif;
        }
    </style>
</head>

<body class="font-poppins bg-white text-gray-800 overflow-x-hidden">

    <!-- Navbar -->
    <section class="max-w-7xl mx-auto px-4">
        <nav class="flex items-center justify-between py-4">
            <a href="#" class="flex items-center gap-2">
                <img src="./image/Vector.png" alt="Logo" class="h-8 w-8 object-contain">
                <h1 class="font-bold text-xl tracking-wide text-black">FASHION</h1>
            </a>

            <div class="flex items-center gap-6">
                <!-- মোবাইলে মেনু হাইড, ডেস্কটপে দেখাবে -->
                <ul class="hidden md:flex items-center gap-8 text-sm font-medium tracking-wide">
                    <li class="cursor-pointer hover:text-yellow-400 transition">CATALOGUE</li>
                    <li class="cursor-pointer hover:text-yellow-400 transition">FASHION</li>
                    <li class="cursor-pointer hover:text-yellow-400 transition">FAVOURITE</li>
                    <li class="cursor-pointer hover:text-yellow-400 transition">LIFESTYLE</li>
                </ul>

                <button
                    class="bg-black text-white text-sm font-semibold tracking-wide px-5 py-2.5 rounded-md hover:text-yellow-400 transition cursor-pointer">
                    SIGN UP
                </button>
            </div>
        </nav>
    </section>
    <!-- Hero Section -->
    <section class="max-w-7xl mx-auto px-4 py-10 bg-slate-100 rounded-[20px]">
        <div class="flex flex-col md:flex-row items-center justify-between gap-10">
            <!-- Left: Text Content -->
            <div class="w-full md:w-1/2 ml-0 md:ml-10">
                <h1 class="inline-block text-3xl md:text-5xl font-bold leading-tight text-gray-900 mb-4 bg-white px-10 py-1">
                    LET'S
                </h1>
                <h1 class="text-3xl md:text-5xl font-bold leading-tight text-gray-900 mb-4">
                    EXPLORE
                </h1>
                <h1 class="inline-block text-3xl md:text-5xl font-bold leading-tight text-gray-900 mb-4 bg-yellow-300 px-10 py-1">
                    UNIQUE
                </h1>
                <h1 class="text-3xl md:text-5xl font-bold leading-tight text-gray-900 mb-4">
                    CLOTHES
                </h1>

                <p class="text-gray-600 text-base md:text-lg mb-6 max-w-md">
                    Live for Influential and Innovative fashion!
                </p>

                <button class="bg-black text-white px-6 py-3 rounded-md font-semibold hover:text-yellow-400 transition cursor-pointer">
                    Shop Now
                </button>
            </div>

            <!-- Right: Banner Image -->
            <div class="w-full md:w-1/2 ml-0 md:ml-10">
                <img src="./image/banner.png" alt="Fashion Banner"
                    class="w-full h-auto max-h-[600px] object-cover rounded-lg">
            </div>
        </div>
    </section>

    
</body>

</html>
